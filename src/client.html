  } catch (err) {
    fail(err);
  }
};
`;

class FileIo {
  constructor(fileHandle) {
    this.fileHandle = fileHandle;
    this.pending = new Map();
    this.nextId = 1;
    const workerUrl = URL.createObjectURL(
      new Blob([IO_WORKER_SRC], { type: "text/javascript" }),
    );
    this.worker = new Worker(workerUrl);
    URL.revokeObjectURL(workerUrl);
    this.worker.onmessage = (e) => {
      const { id, ok, result, error } = e.data;
      const p = this.pending.get(id);
      if (!p) return;
      this.pending.delete(id);
      if (ok) p.resolve(result);
      else p.reject(new Error(error));
    };
  }
  call(op, data = {}, transfer = []) {
    const id = this.nextId++;
    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject });
      this.worker.postMessage({ id, op, data }, transfer);
    });
  }
  open(truncateTo) {
    return this.call("open", { fileHandle: this.fileHandle, truncateTo });
  }
  write(offset, buffer, byteOffset, byteLength) {
    return this.call("write", { offset, buffer, byteOffset, byteLength }, [buffer]);
  }
  flush() {
    return this.call("flush");
  }
  truncate(size) {
    return this.call("truncate", { size });
  }
  async close() {
    try {
      await this.call("close");
    } finally {
      this.worker.terminate();
    }
  }
}

async function prepareReceiver(t, resume) {
  // Reject early when the device cannot hold the file; failing halfway leaves
  // the user staring at a transfer that can never finish.
  try {
    const est = await navigator.storage.estimate();
    const avail = (est.quota || 0) - (est.usage || 0);
    t.quotaAvail = avail;
    if (avail > 0 && t.expectedSize > avail * 0.95) {
      const err = new Error("not enough local storage");
      err.reason = "quota";
      throw err;
    }
  } catch (err) {
    if (err && err.reason === "quota") throw err;
  }

  t.dir = await roomDirectory(state.roomId);
  t.binHandle = await t.dir.getFileHandle(`${t.fileId}.bin`, { create: true });
  t.metaA = await t.dir.getFileHandle(`${t.fileId}.meta.a`, { create: true });
  t.metaB = await t.dir.getFileHandle(`${t.fileId}.meta.b`, { create: true });

  // Resume whenever a valid meta exists for this fileId on disk. This covers
  // both sender-driven retries and a receiver page reload, where the page
  // has no in-memory state left but OPFS still records receivedBytes.
  const loaded = await loadMeta(t.metaA, t.metaB);

  if (loaded) {
    const body = loaded.body;
    if (Number(body.expectedSize) !== t.expectedSize) {
      const err = new Error("size mismatch");
      err.reason = "size_mismatch";
      throw err;
    }
    t.receivedBytes = Number(body.receivedBytes) || 0;
    t.metaVersion = Number(loaded.slot.metaVersion) || 0;
    t.epoch = loaded.slot.epoch || t.epoch;
    t.currentSlot = loaded.name;
    t.writtenBytes = t.receivedBytes;
    t.chunkSize = Number(body.chunkSize) || t.chunkSize;
    t.windowSize = Number(body.windowSize) || t.windowSize;
    // Drop any unpersisted tail before continuing.
    t.io = new FileIo(t.binHandle);
    await t.io.open(t.receivedBytes);
    log(`恢复接收状态: ${fmtBytes(t.receivedBytes)} / ${fmtBytes(t.expectedSize)}`);
  } else {
    // Bump past any stale slot so a fresh state always wins on the next load.
    const old = await loadMeta(t.metaA, t.metaB);
    const baseVersion = old ? Number(old.slot.metaVersion) + 1 : 0;
    const slotName = old && old.name === "a" ? "b" : "a";
    t.receivedBytes = 0;
    t.writtenBytes = 0;
    t.metaVersion = baseVersion;
    t.epoch = crypto.randomUUID();
    t.currentSlot = slotName;
    await writeMetaSlot(
      slotName === "a" ? t.metaA : t.metaB,
      baseVersion,
      t.epoch,
      metaBody(t, 0),
    );
    t.io = new FileIo(t.binHandle);
    await t.io.open(0); // truncates the file
  }
  t.persistCount = 0;
}

async function discardUnpersistedTail(t) {
  if (!t || t.direction !== "recv") return;
  t.writtenBytes = t.receivedBytes;
  t.persistCount = 0;
  t.gapNotified = false;
  if (!t.io) return;
  try {
    await t.io.truncate(t.receivedBytes);
    log(`丢弃未持久化尾部，回到 ${fmtBytes(t.receivedBytes)}`);
  } catch (err) {
    log(`丢弃未持久化尾部失败: ${err.message}`);
  }
}

async function handleBinary(buffer) {
  const chunk = decodeChunk(buffer);
  if (!chunk) {
    log("收到非法二进制帧，已丢弃");
    return;
  }
  const t = state.transfers.get(chunk.transferId);
  if (!t || t.direction !== "recv") {
    send({
      type: "error",
      code: "unknown_transfer",
      transferId: chunk.transferId,
      fatal: false,
    });
    return;
  }
  if (t.state !== "receiving") {
    // Late frame after failure/completion; duplicate rules make this safe.
    if (t.state === "received" && chunk.offset < t.receivedBytes) return;
    return;
  }
  // A retransmit can land inside the unpersisted tail. Drop that tail first,
  // otherwise the frame would be classified as a duplicate and lost forever.
  if (
    chunk.offset < t.writtenBytes &&
    t.writtenBytes > t.receivedBytes &&
    chunk.offset >= t.receivedBytes
  ) {
    await discardUnpersistedTail(t);
  }
  if (chunk.offset < t.writtenBytes) {
    // Duplicate retransmits during a storm can arrive many times per second;
    // one cumulative ACK every 250ms is enough to unstick the sender.
    const now = Date.now();
    if (
      t.receivedBytes > 0 &&
      (!t.lastDupAckAt || now - t.lastDupAckAt >= 250)
    ) {
      t.lastDupAckAt = now;
      sendAck(t);
    }
    return;
  }
  if (chunk.offset > t.writtenBytes) {
    // One gap notification is enough; the sender will rewind and retransmit.
    if (!t.gapNotified) {
      t.gapNotified = true;
      send({
        type: "error",
        code: "offset_gap",
        transferId: t.transferId,
        fileId: t.fileId,
        receivedBytes: t.receivedBytes,
        fatal: false,
      });
    }
    return;
  }
  if (chunk.payload.byteLength === 0) {
    send({
      type: "error",
      code: "bad_message",
      transferId: t.transferId,
      fileId: t.fileId,
      fatal: true,
    });
    failTransfer(t, "empty chunk");
    return;
  }
  if (chunk.payload.byteLength > t.chunkSize) {
    send({
      type: "error",
      code: "bad_chunk_size",
      transferId: t.transferId,
      fileId: t.fileId,
      fatal: true,
    });
    failTransfer(t, "chunk too large");
    return;
  }

  if (state.writeDelayMs) {
    await new Promise((r) => setTimeout(r, state.writeDelayMs));
  }
  const writeStart = performance.now();
  const payloadLen = chunk.payload.byteLength;
  await t.io.write(chunk.offset, chunk.payload.buffer, chunk.payload.byteOffset, payloadLen);
  t.writeMs = (t.writeMs || 0) + (performance.now() - writeStart);
  t.writtenBytes += payloadLen;
  t.persistCount++;
  t.gapNotified = false;
  if (chunk.final) t.finalReceived = true;

  if (t.finalReceived && t.writtenBytes !== t.expectedSize) {
    send({
      type: "error",
      code: "final_size_mismatch",
      transferId: t.transferId,
      fileId: t.fileId,
      fatal: true,
    });
    failTransfer(t, "final size mismatch");
    return;
  }

  if (
    t.persistCount >= (t.persistEvery || PERSIST_EVERY_CHUNKS) ||
    t.finalReceived ||
    t.writtenBytes >= t.expectedSize
  ) {
    await persistReceiver(t);
  }
  updateIncoming(t);
}

async function persistReceiver(t) {
  if (!t.io) return;
  const prev = {
    receivedBytes: t.receivedBytes,
    metaVersion: t.metaVersion,
    currentSlot: t.currentSlot,
  };
  const flushStart = performance.now();
  await t.io.flush();
  const flushMs = performance.now() - flushStart;
  t.flushMs = (t.flushMs || 0) + flushMs;
  if (flushMs > 1000) log(`持久化 flush 耗时 ${Math.round(flushMs)}ms`);

  const newReceived = t.writtenBytes;
  const newVersion = prev.metaVersion + 1;
  const nextSlot = prev.currentSlot === "a" ? "b" : "a";

  try {
    const metaStart = performance.now();
    await writeMetaSlot(
      nextSlot === "a" ? t.metaA : t.metaB,
      newVersion,
      t.epoch,
      metaBody(t, newReceived),
    );
    t.metaMs = (t.metaMs || 0) + (performance.now() - metaStart);
    t.receivedBytes = newReceived;
    t.metaVersion = newVersion;
    t.currentSlot = nextSlot;
  } catch (err) {
    // Roll back to the last known good slot and discard the unpersisted tail.
    t.receivedBytes = prev.receivedBytes;
    t.metaVersion = prev.metaVersion;
    t.currentSlot = prev.currentSlot;
    t.writtenBytes = prev.receivedBytes;
    try {
      await t.io.truncate(prev.receivedBytes);
    } catch {
      t.io = null;
    }
    t.persistCount = 0;
    log(`meta 写入失败，回退到 ${fmtBytes(prev.receivedBytes)}`);
    failTransfer(t, "meta_write_failed");
    return;
  }

  t.persistCount = 0;
  sendAck(t);

  if (t.receivedBytes >= t.expectedSize) {
    t.state = "received";
    // Release the exclusive sync handle so hashing/download can open the file.
    try {
      await t.io.close();
    } catch {}
    t.io = null;
    updateIncoming(t);
    log(`接收完成: ${t.name}`);
    computeHash(t).catch(() => {});
  } else {
    updateIncoming(t);
  }
}

function sendAck(t) {
  send({
    type: "ack",
    transferId: t.transferId,
    fileId: t.fileId,
    receivedBytes: t.receivedBytes,
    metaVersion: t.metaVersion,
    epoch: t.epoch,
  });
}

async function handleComplete(msg) {
  const t = state.transfers.get(msg.transferId);
  if (!t || t.direction !== "recv" || msg.fileId !== t.fileId) return;
  if (t.state === "failed") {
    send({
      type: "error",
      code: "transfer_failed",
      transferId: t.transferId,
      fileId: t.fileId,
      fatal: true,
    });
    return;
  }
  if (t.state !== "received" || t.receivedBytes !== t.expectedSize) {
    send({
      type: "error",
      code: "incomplete",
      transferId: t.transferId,
      fileId: t.fileId,
      receivedBytes: t.receivedBytes,
      fatal: false,
    });
    return;
  }
  if (msg.size != null && Number(msg.size) !== t.expectedSize) {
    send({
      type: "error",
      code: "size_mismatch",
      transferId: t.transferId,
      fileId: t.fileId,
      fatal: true,
    });
    failTransfer(t, "size mismatch");
    return;
  }
  if (!t.completeAck) {
    t.completeAck = {
      transferId: t.transferId,
      fileId: t.fileId,
      receivedBytes: t.receivedBytes,
      metaVersion: t.metaVersion,
      epoch: t.epoch,
    };
  }
  // Rebuild with the current connection identity; a duplicate complete can
  // arrive on a newer connection after a reconnect.
  send({ type: "complete-ack", ...t.completeAck });
}

async function computeHash(t) {
  if (t.hash) return t.hash;
  if (t.expectedSize > 256 * 1024 * 1024) {
    // A 1 GiB ArrayBuffer + digest is too heavy for the page; large-file
    // integrity is checked via segment hashes instead.
    log("文件较大，跳过整文件哈希");
    return null;
  }
  try {
    const file = await t.binHandle.getFile();
    const buf = await file.arrayBuffer();
    t.hash = await sha256Hex(buf);
    updateIncoming(t);
    return t.hash;
  } catch (err) {
    log(`计算哈希失败: ${err.message}`);
    return null;
  }
}

const STATE_LABELS = {
  offering: "协商中",
  sending: "发送中",
  completing: "校验中",
  completed: "已完成",
  offered: "待确认",
  receiving: "接收中",
  received: "已完成",
  partial: "未完成",
  failed: "失败",
};

function stateLabel(t) {
  return STATE_LABELS[t.state] || t.state;
}

function sampleRate(t, bytes) {
  const now = Date.now();
  if (!t.rateSample) {
    t.rateSample = { at: now, bytes };
    return 0;
  }
  const dt = now - t.rateSample.at;
  if (dt >= 500) {
    t.speed = Math.max(0, (bytes - t.rateSample.bytes) / (dt / 1000));
    t.rateSample = { at: now, bytes };
  }
  return t.speed || 0;
}

function outgoingDetail(t) {
  if (t.state === "completed") return "通道已释放";
  if (t.state === "failed") return `失败${t.error ? " · " + t.error : ""}`;
  if (t.paused) return "已暂停";
  if (t.state === "completing") return "校验中";
  if (t.state === "offering") return "等待接收端接受";
  return `${fmtProgress(t.ackedOffset, t.size)} · ${fmtSpeed(t.sentOffset, Date.now() - t.startedAt)}`;
}

function updateOutgoing(t) {
  const el = document.querySelector(`#outgoing .item[data-transfer-id="${t.transferId}"]`);
  if (!el) return;
  // Main progress is the persisted/acked offset, not what was handed to the
  // socket: the bar must never run ahead of what the peer actually has.
  const pct = t.size ? Math.min(100, (t.ackedOffset / t.size) * 100) : 0;
  sampleRate(t, t.ackedOffset);
  const bar = el.querySelector(".bar");
  let barClass = "bar";
  if (t.state === "failed") barClass += " bad";
  else if (t.paused) barClass += " warn";
  else if (t.state === "sending" && !state.reconnectVisible) barClass += " flow";
  bar.className = barClass;
  bar.querySelector("i").style.width = `${pct}%`;
  el.querySelector(".state").textContent = stateLabel(t);
  el.querySelector(".detail").textContent = outgoingDetail(t);
  const pauseBtn = el.querySelector(".btn-pause");
  if (pauseBtn) {
    pauseBtn.classList.toggle("hidden", t.state !== "sending");
    pauseBtn.textContent = t.paused ? "继续" : "暂停";
  }
}

function renderIncoming() {
  const root = $("incoming");
  const items = [...state.transfers.values()].filter((t) => t.direction === "recv");
  const count = $("recvCount");
  if (count) count.textContent = items.length ? `${items.length} 个文件` : "";
  refreshReceivedButton();
  refreshIncompleteButton();
  if (items.length === 0) {
    root.innerHTML = '<div class="empty">等待对端发送文件。</div>';
    return;
  }
  root.innerHTML = "";
  for (const t of items) {
    const el = document.createElement("div");
    el.className = "item recv-item";
    el.dataset.transferId = String(t.transferId);
    el.innerHTML = `
      <div class="file-row"><span class="name"></span><span class="size mono"></span></div>
      <div class="bar"><i></i></div>
      <div class="meta"><span class="state"></span><span class="detail mono"></span></div>
      <div class="row" style="margin-top:8px">
        <button class="ghost accept hidden">接收</button>
        <button class="ghost reject hidden">拒绝</button>
        <button class="ghost accept-batch hidden">本批全部接收</button>
        <button class="ghost save hidden">保存到设备</button>
        <button class="ghost remove hidden">删除</button>
        <span class="hash"></span>
      </div>
    `;
    el.querySelector(".name").textContent = t.path || t.name;
    el.querySelector(".size").textContent = fmtBytes(t.expectedSize);
    el.querySelector(".accept").addEventListener("click", () => acceptOffer(t));
    el.querySelector(".reject").addEventListener("click", () => rejectOffer(t));
    el.querySelector(".accept-batch").addEventListener("click", () => acceptBatch(t));
    el.querySelector(".save").addEventListener("click", () => downloadReceived(t));
    el.querySelector(".remove").addEventListener("click", () => removeIncoming(t));
    root.appendChild(el);
    updateIncoming(t);
  }
}

function scrollIncomingIntoView(transferId) {
  requestAnimationFrame(() => {
    const el = document.querySelector(`#incoming .item[data-transfer-id="${transferId}"]`);
    if (el) el.scrollIntoView({ block: "nearest" });
  });
}

function incomingDetail(t) {
  if (t.state === "offered") return `等待你确认接收 · ${fmtBytes(t.expectedSize)}`;
  if (t.state === "partial") return `未完成 · ${fmtProgress(t.receivedBytes, t.expectedSize)}`;
  if (t.state === "received") return "已写入本机，可保存";
  if (t.state === "failed") return `失败${t.error ? " · " + t.error : ""}`;
  if (t.peerPaused) return "发送端已暂停";
  const writing = t.writtenBytes > t.receivedBytes + t.chunkSize;
  const base = `${fmtProgress(t.receivedBytes, t.expectedSize)} · ${fmtSpeed(t.receivedBytes, Date.now() - t.startedAt)}`;
  return writing ? `${base} · 写入本机中` : base;
}

function updateIncoming(t) {
  const el = document.querySelector(`#incoming .item[data-transfer-id="${t.transferId}"]`);
  if (!el) return;
  const pct = t.expectedSize ? Math.min(100, (t.receivedBytes / t.expectedSize) * 100) : 0;
  sampleRate(t, t.receivedBytes);
  const bar = el.querySelector(".bar");
  let barClass = "bar";
  if (t.state === "failed") barClass += " bad";
  else if (t.peerPaused) barClass += " warn";
  else if (t.state === "receiving" && !state.reconnectVisible) barClass += " flow";
  bar.className = barClass;
  bar.querySelector("i").style.width = `${pct}%`;
  el.querySelector(".state").textContent = stateLabel(t);
  el.querySelector(".detail").textContent = incomingDetail(t);
  const canDecide = t.state === "offered";
  el.querySelector(".accept").classList.toggle("hidden", !canDecide);
  el.querySelector(".reject").classList.toggle("hidden", !canDecide);
  el.querySelector(".accept-batch").classList.toggle(
    "hidden",
    !(canDecide && t.batchTotal > 1),
  );
  const save = el.querySelector(".save");
  save.classList.toggle("hidden", t.state !== "received");
  const remove = el.querySelector(".remove");
  remove.classList.toggle(
    "hidden",
    !(t.state === "partial" || t.state === "failed"),
  );
  const hashEl = el.querySelector(".hash");
  if (t.hash) hashEl.textContent = `SHA-256 ${t.hash}`;
  refreshReceivedButton();
}

function receivedTransfers() {
  return [...state.transfers.values()].filter(
    (t) => t.direction === "recv" && t.state === "received",
  );
}

function refreshReceivedButton() {
  const btn = $("clearReceivedBtn");
  if (!btn) return;
  btn.disabled = state.clearingReceived || receivedTransfers().length === 0;
}

function incompleteTransfers() {
  return [...state.transfers.values()].filter(
    (t) => t.direction === "recv" && (t.state === "partial" || t.state === "failed"),
  );
}

function refreshIncompleteButton() {
  const btn = $("clearIncompleteBtn");
  if (!btn) return;
  btn.disabled = incompleteTransfers().length === 0;
}

async function deleteTransferFiles(dir, t) {
  if (t.io) {
    try {
      await t.io.close();
    } catch {}
    t.io = null;
  }
  let ok = true;
  for (const name of [`${t.fileId}.bin`, `${t.fileId}.meta.a`, `${t.fileId}.meta.b`]) {
    try {
      await dir.removeEntry(name);
    } catch (err) {
      if (err && err.name === "NotFoundError") continue;
      ok = false;
      log(`删除失败 ${name}: ${err.message || err}`);
    }
  }
  return ok;
}

async function removeIncoming(t) {
  if (!t || t.direction !== "recv") return;
  if (t.state !== "partial" && t.state !== "failed") return;
  let dir;
  try {
    dir = await roomDirectory(state.roomId);
  } catch (err) {
    log(`清理失败：${err.message || err}`);
    return;
  }
  if (await deleteTransferFiles(dir, t)) {
    state.transfers.delete(t.transferId);
    renderIncoming();
    log(`已删除未完成：${t.path || t.name}`);
  }
}

async function clearIncompleteFiles() {
  const items = incompleteTransfers();
  let dir;
  try {
    dir = await roomDirectory(state.roomId);
  } catch (err) {
    log(`清理失败：${err.message || err}`);
    return;
  }
  let removed = 0;
  let failed = 0;
  for (const t of items) {
    if (await deleteTransferFiles(dir, t)) {
      state.transfers.delete(t.transferId);
      removed += 1;
    } else {
      failed += 1;
    }
  }
  // Orphans (e.g. a .bin whose meta was lost) have no row to drive deletion.
  const keep = new Set(
    [...state.transfers.values()]
      .filter((t) => t.direction === "recv" &&
        (t.state === "received" || t.state === "receiving" || t.state === "offered"))
      .map((t) => t.fileId),
  );
  const fileRe = /^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\.(bin|meta\.[ab])$/i;
  try {
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind !== "file") continue;
      const m = fileRe.exec(name);
      if (!m || keep.has(m[1].toLowerCase())) continue;
      try {
        await dir.removeEntry(name);
        removed += 1;
      } catch {
        failed += 1;
      }
    }
  } catch {
    // Best-effort orphan sweep.
  }
  renderIncoming();
  log(`清理未完成 ${removed} 项${failed ? `，${failed} 项失败` : ""}`);
}

function finishedOutgoingTransfers() {
  return [...state.transfers.values()].filter(
    (t) => t.direction === "send" && (t.state === "completed" || t.state === "failed"),
  );
}

function refreshClearOutgoingButton() {
  const btn = $("clearOutgoingBtn");
  if (!btn) return;
  btn.disabled = finishedOutgoingTransfers().length === 0;
}

function clearOutgoingFiles() {
  const done = finishedOutgoingTransfers();
  if (!done.length) return;
  for (const t of done) state.transfers.delete(t.transferId);
  if (state.batch && state.batch.done >= state.batch.items.length) {
    const activeSend = [...state.transfers.values()].some(
      (t) => t.direction === "send" && ["offering", "sending", "completing"].includes(t.state),
    );
    if (!activeSend) state.batch = null;
  }
  renderOutgoing();
  updateBatchHint();
  renderStatus();
  log(`已清理发送记录 ${done.length} 条`);
}

// Removes the OPFS copies (data + both meta slots) and drops the rows. A file
// whose entries cannot be deleted stays in the list, so the UI never claims a
// cleanup that did not happen.
async function clearReceivedFiles() {
  const items = receivedTransfers();
  if (!items.length) return;
  let dir;
  try {
    dir = await roomDirectory(state.roomId);
  } catch (err) {
    log(`清理失败：${err.message || err}`);
    return;
  }
  let removed = 0;
  let failed = 0;
  for (const t of items) {
    if (await deleteTransferFiles(dir, t)) {
      state.transfers.delete(t.transferId);
      removed += 1;
    } else {
      failed += 1;
    }
  }
  renderIncoming();
  log(`清理已接收文件 ${removed} 个${failed ? `，${failed} 个删除失败` : ""}`);
}

async function downloadReceived(t) {
  try {
    const file = await t.binHandle.getFile();
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url;
    a.download = ((t.path || t.name).split("/").pop() || "file.bin");
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (err) {
    log(`保存失败: ${err.message}`);
  }
}

function normalizeRoomInput(value) {
  const raw = value.trim();
  if (!raw) return null;
  const m = raw.match(/\/r\/([^/?#]+)/);
  if (m) return decodeURIComponent(m[1]);
  return raw;
}

async function beginWithRoom(room, password) {
  state.passwordHash = password
    ? await sha256Hex(new TextEncoder().encode(password))
    : null;
  history.pushState({}, "", `/r/${encodeURIComponent(room)}`);
  startWithRoom(room);
}

  btn.textContent = "清空已完成";
}
$("clearOutgoingBtn").addEventListener("click", () => {
  const btn = $("clearOutgoingBtn");
  if (!btn.dataset.confirm) {
    btn.dataset.confirm = "1";
    btn.textContent = "确认清空？";
    clearTimeout(clearOutgoingTimer);
    clearOutgoingTimer = setTimeout(resetClearOutgoingConfirm, 3000);
    return;
  }
  resetClearOutgoingConfirm();
  clearOutgoingFiles();
});

$("folderBtn").addEventListener("click", () => $("folderInput").click());
$("folderInput").addEventListener("change", () => {
  addPendingFiles($("folderInput").files);
  $("folderInput").value = "";
});

// Keep the send button and the global status line fresh.
setInterval(() => {
  refreshSendButton();
  renderStatus();
}, 500);

const initialRoom = roomFromPath();
if (initialRoom) {
  startWithRoom(initialRoom);
} else {
  $("joinView").classList.remove("hidden");
}

window.__relay = {
  state,
  setAutoAccept(value) {
    applyAutoAccept(Boolean(value));
  },
  dropNextBinary(n = 1) {
    state.dropNextBinary = Number(n) || 1;
  },
  dropNextControl(type = "complete", count = 1) {
    state.dropNextControl = String(type);
    state.dropNextControlCount = Number(count) || 1;
  },
  pause(transferId) {
    pauseTransfer([...state.transfers.values()].find((t) => t.transferId === Number(transferId)));
  },
  resume(transferId) {
    resumeTransfer([...state.transfers.values()].find((t) => t.transferId === Number(transferId)));
  },
  setWriteDelay(ms) {
    state.writeDelayMs = Math.max(0, Number(ms) || 0);
  },
  setReconnectPaused(paused) {
    state.reconnectPaused = Boolean(paused);
    if (!state.reconnectPaused && !state.stopped && state.roomId &&
        (!state.ws || state.ws.readyState !== WebSocket.OPEN)) {
      connect();
    }
  },
  getQrMatrix() {
    return state.qrMatrix;
  },
  getShareLink() {
    return state.roomId ? shareLinkFor(state.roomId) : null;
  },
  getTransfers() {
    return [...state.transfers.values()].map((t) => ({
      transferId: t.transferId,
      fileId: t.fileId,
      direction: t.direction,
      name: t.name,
      path: t.path || null,
      batchId: t.batchId || null,
      size: t.size ?? t.expectedSize,
      expectedSize: t.expectedSize ?? null,
      state: t.state,
      sentOffset: t.sentOffset,
      ackedOffset: t.ackedOffset,
      windowSize: t.windowSize,
      paused: Boolean(t.paused),
      receivedBytes: t.receivedBytes,
      writtenBytes: t.writtenBytes,
      metaVersion: t.metaVersion,
      epoch: t.epoch,
      writeMs: Math.round(t.writeMs || 0),
      flushMs: Math.round(t.flushMs || 0),
      metaMs: Math.round(t.metaMs || 0),
      error: t.error || null,
      hash: t.hash || null,
    }));
  },
  async getReceivedHash(fileId) {
    const t = [...state.transfers.values()].find((x) => x.fileId === fileId && x.direction === "recv");
    if (!t) throw new Error("transfer not found");
    return computeHash(t);
  },
  async getReceivedSegmentHashes(fileId, segBytes = 64 * 1024 * 1024) {
    const t = [...state.transfers.values()].find((x) => x.fileId === fileId && x.direction === "recv");
    if (!t) throw new Error("transfer not found");
    const file = await t.binHandle.getFile();
    const out = [];
    for (let off = 0; off < file.size; off += segBytes) {
      const buf = await file.slice(off, Math.min(off + segBytes, file.size)).arrayBuffer();
      out.push(await sha256Hex(buf));
    }
    return out;
  },
  async getReceivedSize(fileId) {
    const t = [...state.transfers.values()].find((x) => x.fileId === fileId && x.direction === "recv");
    if (!t) throw new Error("transfer not found");
    const file = await t.binHandle.getFile();
    return file.size;
  },
  logs() {
    return state.logs.slice();
  },
};
</script>
</body>
